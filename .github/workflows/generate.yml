name: Generate Contributions SVG

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm test

      # Sync runs locally via sync-contributions.sh — GitHub serves count-less
      # calendar pages to Actions IPs, so scraping from CI silently no-ops.
      # CI only renders the SVG from the committed data.
      - run: npm run generate

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "stats: regenerate SVG $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
